server {
    listen 80;
    server_name _;

    # 允许大文件上传（合同 Word / 附件），防止 413
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # gzip：antd + echarts 构建产物体积较大，开启后首屏传输量可降至 1/3 左右。
    # 注意 gzip_types 必须显式列出才会压缩；Nginx 默认只压 text/html。
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml+rss
        application/vnd.ms-fontobject
        font/ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # 带 hash 的构建产物（vite 默认输出到 assets/app.<hash>.js）可长期强缓存
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri $uri/ /index.html;
    }

    # SPA 入口禁止强缓存：否则发版后浏览器仍用旧 index.html 去引用已被删除的旧 chunk
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 后端 API 反向代理（前端构建已用相对路径 /api，不会写死 localhost）
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 合同/报表导出（exceljs、html-to-docx）耗时较长，放宽超时避免 504
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 前端 SPA 路由回退（刷新子路由不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }
}

version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: cms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms123456
      POSTGRES_DB: cms
    ports:
      - '5432:5432'
    volumes:
      - cms-pgdata:/var/lib/postgresql/data

volumes:
  cms-pgdata:

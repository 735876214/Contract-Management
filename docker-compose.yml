# 合同管理系统（CMS）Docker 部署 —— 面向 NAS（群晖 / 威联通 / Unraid）
# 架构：前端 nginx（构建产物 + 反向代理 /api） + 后端 NestJS（SQLite 持久化）
# 默认使用 SQLite，零外部依赖；HTTPS / 域名反向代理交给 NAS 的 Reverse Proxy 处理。
#
# 核心：构建时由 Docker 直接从 GitHub 私有仓库克隆源码（用 .env 里的 GITHUB_TOKEN），
# NAS 上【无需上传/放置源码】，也不需要 ghcr.io 镜像。每次 `up --build` 都拉最新 main 重新构建。
#
# 部署步骤：
#   1. cp .env.example .env，并必须填入 GITHUB_TOKEN（具有 repo 权限的 Personal Access Token）。
#      —— JWT_SECRET / CMS_DATA 已内联默认值进本文件，不填也能跑；想覆盖则在 .env 设。
#      —— 若把 GitHub 仓库设为 Public，则 GITHUB_TOKEN 可留空，并把下面 context 里的
#         `x-access-token:${GITHUB_TOKEN}@` 删掉即可。
#   2. docker compose up -d --build
#   3. 在 NAS 反向代理中把 域名:443 -> 本机 8080，并启用 HTTPS。
#
# 端口说明：对外仅暴露 8080（避免与 NAS 占用的 80 冲突），容器内部仍是 80；
# 后端不对外暴露端口，仅通过 frontend 的 nginx 经 docker 内网代理访问。

services:
  backend:
    # 远程 git 构建上下文：构建时 Docker 自动克隆私有仓库的 server 子目录（main 分支）。
    # 凭据用 .env 的 GITHUB_TOKEN（repo 权限）；仓库若改为 Public 则去掉 x-access-token 部分。
    build:
      context: "https://x-access-token:${GITHUB_TOKEN}@github.com/735876214/Contract-Management.git#main:server"
      dockerfile: Dockerfile
    container_name: cms-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      # SQLite 数据文件落在 bind mount 目录内，容器重建不丢数据
      DATABASE_URL: "file:/data/cms.db"
      # JWT 密钥：内联默认值（已从 .env 取的真实密钥），若宿主机 .env 设了 JWT_SECRET 则覆盖
      JWT_SECRET: "${JWT_SECRET:-LspmRt4t0rJQGpPA40W3T4CfEb8CxompaI9s64z1AeVpENsRMKLR3a2JamDyGfkn}"
      JWT_EXPIRES_IN: "7d"
      # 上传文件也存进 bind mount 目录
      UPLOAD_DIR: "/data/uploads"
    # bind mount 到 NAS 共享文件夹（已内联群晖默认路径，可直接跑；如用其他 NAS 改此行即可）
    # 群晖   ：/volume1/docker/cms/data
    # 威联通 ：/share/CACHEDEV1_DATA/Container/cms/data
    # Unraid ：/mnt/user/appdata/cms/data
    # 注：若宿主机 .env 设了 CMS_DATA，会覆盖此内联路径。
    volumes:
      - /volume1/docker/cms/data:/data
    expose:
      - "3000"
    # 限制日志体积，防止 NAS 磁盘被 Docker 日志写满
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: "https://x-access-token:${GITHUB_TOKEN}@github.com/735876214/Contract-Management.git#main:web"
      dockerfile: Dockerfile
    container_name: cms-frontend
    restart: unless-stopped
    # 对外 8080，避免与 NAS 已占用的 80 冲突
    ports:
      - "8080:80"
    depends_on:
      - backend
    logging:
      options:
        max-size: "10m"
        max-file: "3"

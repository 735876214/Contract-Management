# CMS 部署：前后端合并为「一个」容器（内部 nginx 托管前端并把 /api 反代到同容器 127.0.0.1:3000）
# 数据库：PostgreSQL（单一数据库，已移除 SQLite 演示变体）
#
# 部署前必改三处（直接改本文件，不用 .env）：
#   ① postgres 服务的 NAS 数据路径（pgdata）
#   ② cms 服务的 NAS 附件路径（data）          ← 两处路径都在下方 volumes 里，有「← NAS 路径」标注
#   ③ JWT_SECRET（生成：openssl rand -base64 48）——不等于默认占位值才能安全对外
#
# 用法：
#   1. 直接拉预构建镜像（需先登录 ghcr.io，见下方说明）：
#        docker compose pull && docker compose up -d
#      想固定版本就把 image 的 tag 换成 CI 产出的 sha-<commit sha>。
#   2. 本地构建（镜像不可访问时的兜底，推荐本机/无 PAT 场景）：
#        docker compose up -d --build
#      构建出来的就是同一个 ghcr.io/735876214/cms-single:latest tag；
#      因为 pull_policy 是 missing，本地已有该 tag 时不会再尝试去远端拉。
#
# ⚠ ghcr.io/735876214/cms-single 目前【不是公开包】，匿名 pull 会报
#   `error from registry: denied`。两种解法二选一：
#   a) 登录 ghcr.io（需要有 read:packages 权限的 PAT）：
#        docker logout ghcr.io
#        docker login ghcr.io -u 735876214   # 密码填 PAT（勾选 read:packages）
#      之后再 docker compose pull
#   b) 永久解绑：GitHub → 个人头像 → Your packages → cms-single →
#      Package settings → Danger Zone → Change visibility → Public
#  若两者都不想做，直接用上面的「本地构建」方式。
#
# 首次启动（空库）后端会自动 seed：默认管理员（DEFAULT_ADMIN_USERNAME/PASSWORD）、
# 默认项目、字典类型/字典项/系统参数；已有数据则跳过，重复启动安全。
# 数据持久化：PostgreSQL 数据与上传附件都落在下方 compose 里指定的两个 NAS 绝对路径
#（bind mount，NAS 文件管理器直接可见、可纳入 NAS 的备份计划）。
# 更新：手动执行 `docker compose pull && docker compose up -d`（有意不做 Watchtower / 计划任务自动更新）。

services:
  postgres:
    image: postgres:16-alpine
    container_name: cms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms123456
      POSTGRES_DB: cms
      TZ: Asia/Shanghai
    volumes:
      - /volume1/docker/cms/pgdata:/var/lib/postgresql/data   # ← NAS 路径：改成你的实际目录（群晖示例）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  cms:
    image: ghcr.io/735876214/cms-single:latest
    pull_policy: missing         # 本地已有同名 tag（含本地构建产物）就不拉远端；取最新请显式 docker compose pull
    # 本地构建：docker compose up -d --build
    build:
      context: .                 # 必须在仓库根目录执行（Dockerfile 里 COPY server/ web/ deploy/）
      dockerfile: deploy/single/Dockerfile.single
    container_name: cms
    init: true                   # 以 tini 作 PID1，正确转发信号、回收僵尸进程
    restart: unless-stopped      # 被终止后自动重启，缓解平台自动回收问题
    stop_grace_period: 30s       # 给 start.sh 优雅停后端 + nginx 的时间
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9080:8080"              # 对外端口：宿主机 9080 → 容器 8080；被占用就改左边
    environment:
      NODE_ENV: production
      PORT: "3000"               # 容器内后端端口，nginx /api 固定反代到这里
      TZ: Asia/Shanghai          # 合同到期日 / 时间戳按本地时区计算，避免差 8 小时
      # PostgreSQL 连接（与上方 postgres 服务一致；生产请改用强密码）
      DATABASE_URL: "postgresql://cms:cms123456@postgres:5432/cms?schema=public"
      # JWT 签名密钥：必须换成随机值（openssl rand -base64 48）。
      # 不改就上外网 = 任何拿到这串占位值的人都能伪造登录态，等于裸奔。
      JWT_SECRET: "change-me-openssl-rand-base64-48"
      JWT_EXPIRES_IN: "7d"
      UPLOAD_DIR: "/data/uploads"
      # 首次部署空库时自动创建的管理员凭据，装好后请立即改密码
      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_PASSWORD: admin123
      # AI 助手（可选）：「模板智能填报」用；三项齐全才启用，缺任一项功能自动降级为「手工映射」。
      # 兼容 OpenAI Chat Completions 协议；密钥只写在这台机器的 compose 里，不要提交到仓库。
      # AI_BASE_URL: "https://your-llm-gateway.example/v1"
      # AI_API_KEY: "sk-..."
      # AI_MODEL: "cn:deepseek-v4.1-flash"
    # 上传文件目录：改成你的 NAS 实际目录（与 postgres 的数据路径放同一父目录便于备份）
    volumes:
      - /volume1/docker/cms/data:/data   # ← NAS 路径：改成你的实际目录
    # 限制日志体积，防止 NAS 磁盘被 Docker 日志写满
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # 基础镜像（node:20-slim）默认无 wget，改用 node 探测对外端口
      test: ["CMD", "node", "-e", "require('net').connect(8080,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

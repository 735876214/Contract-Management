# CMS 部署：前后端合并为「一个」容器（内部 nginx 托管前端并把 /api 反代到同容器 127.0.0.1:3000）
#
# 用法：
#   1. 直接拉预构建公开镜像（推荐，无需源码 / 构建）：
#      docker compose up -d
#   2. 本地构建验证：
#      docker build -f deploy/single/Dockerfile.single -t cms-single:local .
#      然后把下方 image 改为 cms-single:local、注释掉 pull_policy，再 up -d
#
# 对外只暴露一个端口（默认 9080），内部 nginx 把 /api 反代到同容器 127.0.0.1:3000。
# restart: unless-stopped + healthcheck + init: true 保证容器被平台回收 / 终止后自动重启，
# 并正确回收僵尸进程，提升长时间运行稳定性。
#
# 数据持久化：SQLite 与上传文件落在 bind mount 的 /data，容器重建不丢数据。

services:
  cms:
    image: ghcr.io/735876214/cms-single:latest
    pull_policy: always          # 每次启动都拉最新镜像（CI 在 push 到 main 时自动重建推送）
    container_name: cms
    init: true                   # 以 tini 作 PID1，正确转发信号、回收僵尸进程
    restart: unless-stopped      # 被终止后自动重启，缓解平台自动回收问题
    ports:
      - "${CMS_HTTP_PORT:-9080}:8080"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # SQLite 数据文件落在 bind mount 目录内，容器重建不丢数据
      DATABASE_URL: "file:/data/cms.db"
      JWT_SECRET: "${JWT_SECRET:-LspmRt4t0rJQGpPA40W3T4CfEb8CxompaI9s64z1AeVpENsRMKLR3a2JamDyGfkn}"
      JWT_EXPIRES_IN: "7d"
      UPLOAD_DIR: "/data/uploads"
    # bind mount 到 NAS 共享文件夹（内联群晖默认路径，可直接跑）
    # 群晖   ：/volume1/docker/cms/data
    # 威联通 ：/share/CACHEDEV1_DATA/Container/cms/data
    # Unraid ：/mnt/user/appdata/cms/data
    # 若宿主机 .env 设了 CMS_DATA，会覆盖此值。
    volumes:
      - /volume1/docker/cms/data:/data
    # 限制日志体积，防止 NAS 磁盘被 Docker 日志写满
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # 基础镜像（node:20-slim）默认无 wget，改用 node 探测对外端口
      test: ["CMD", "node", "-e", "require('net').connect(8080,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

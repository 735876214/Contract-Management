# 合同管理系统（CMS）Docker 部署 —— 面向 NAS（群晖 / 威联通 / Unraid）
# 架构：前端 nginx（构建产物 + 反向代理 /api） + 后端 NestJS（SQLite 持久化）
# 默认使用 SQLite，零外部依赖；HTTPS / 域名反向代理交给 NAS 的 Reverse Proxy 处理。
#
# 部署步骤：
#   1.（可选）cp .env.example .env 并填入你自己的值做覆盖。
#      —— 关键变量 JWT_SECRET / CMS_DATA 已内联默认值进本文件，不准备 .env 也能直接跑。
#      —— 若想覆盖：在 .env 里设 JWT_SECRET / CMS_DATA 即可（用 ${VAR:-默认} 语法，有则覆盖）。
#   2. docker compose up -d --build
#   3. 在 NAS 反向代理中把 域名:443 -> 本机 8080，并启用 HTTPS。
#
# 端口说明：对外仅暴露 8080（避免与 NAS 占用的 80 冲突），容器内部仍是 80；
# 后端不对外暴露端口，仅通过 frontend 的 nginx 经 docker 内网代理访问。

services:
  backend:
    # 预构建镜像来自 GitHub Container Registry（ghcr.io）；无需本地 build，故不写 build: 上下文。
    image: ghcr.io/735876214/cms-backend:latest
    pull_policy: always   # 每次 up 都拉取最新镜像（首次部署也是如此）
    container_name: cms-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      # SQLite 数据文件落在 bind mount 目录内，容器重建不丢数据
      DATABASE_URL: "file:/data/cms.db"
      # JWT 密钥：内联默认值（已从 .env 取的真实密钥），若宿主机 .env 设了 JWT_SECRET 则覆盖
      JWT_SECRET: "${JWT_SECRET:-LspmRt4t0rJQGpPA40W3T4CfEb8CxompaI9s64z1AeVpENsRMKLR3a2JamDyGfkn}"
      JWT_EXPIRES_IN: "7d"
      # 上传文件也存进 bind mount 目录
      UPLOAD_DIR: "/data/uploads"
    # bind mount 到 NAS 共享文件夹（已内联群晖默认路径，可直接跑；如用其他 NAS 改此行即可）
    # 群晖   ：/volume1/docker/cms/data
    # 威联通 ：/share/CACHEDEV1_DATA/Container/cms/data
    # Unraid ：/mnt/user/appdata/cms/data
    # 注：若宿主机 .env 设了 CMS_DATA，会覆盖此内联路径。
    volumes:
      - /volume1/docker/cms/data:/data
    expose:
      - "3000"
    # 限制日志体积，防止 NAS 磁盘被 Docker 日志写满
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/735876214/cms-frontend:latest
    pull_policy: always
    container_name: cms-frontend
    restart: unless-stopped
    # 对外 8080，避免与 NAS 已占用的 80 冲突
    ports:
      - "8080:80"
    depends_on:
      - backend
    logging:
      options:
        max-size: "10m"
        max-file: "3"
